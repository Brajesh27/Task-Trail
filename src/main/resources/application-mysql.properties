# Turn on with:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# (Docker Compose turns it on for you.) Values come from environment variables, with local defaults.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tasktrail?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:tasktrail}
spring.datasource.password=${DB_PASSWORD:tasktrail}
# update: create missing tables, keep the data between restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
