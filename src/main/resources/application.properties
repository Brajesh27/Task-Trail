spring.application.name=tasktrail
server.port=8080
# Turn off template caching so HTML edits show up on refresh while learning
spring.thymeleaf.cache=false
spring.datasource.url=jdbc:h2:mem:tasktrail
spring.h2.console.enabled=true
spring.jpa.show-sql=true
# When the carry-forward job runs: second minute hour day month weekday
tasktrail.carry-forward.cron=0 5 0 * * *
# When the reminder emails go out (every day at 08:00)
tasktrail.reminders.cron=0 0 8 * * *
# Emails are only logged until you set this to true and fill in spring.mail.* (see README)
tasktrail.mail.enabled=false
tasktrail.mail.from=tasktrail@example.com
