<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change password</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <h1>Change password</h1>

    <form th:action="@{/account/password}" th:object="${passwordForm}" method="post">
        <p>
            <label>Current password<br><input type="password" th:field="*{currentPassword}"></label>
            <span class="error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
        </p>
        <p>
            <label>New password<br><input type="password" th:field="*{newPassword}"></label>
            <span class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
        </p>
        <p>
            <label>Type the new password again<br><input type="password" th:field="*{confirmPassword}"></label>
            <span class="error" th:if="${#fields.hasErrors('confirmed')}" th:errors="*{confirmed}"></span>
        </p>
        <button type="submit">Change password</button>
    </form>

    <p><a th:href="@{${dashboard}}">Back to dashboard</a></p>
</body>
</html>
